[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-collector"
version = "1.0.0"
requires-python = ">=3.11"
license = { text = "MIT" }  # Временно для теста

[project.scripts]
collect_log = "log_collector.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["log_collector*"]